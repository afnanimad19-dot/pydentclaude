# Deploy the Pydent LiveKit worker (livekit-agent/) to LiveKit Cloud from GitHub
# — no LiveKit CLI needed on your computer.
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions.
# Add these as REPOSITORY secrets (the "Secrets" tab, "New repository secret");
# repository Variables (the "Variables" tab) also work as a fallback:
#   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET  (LiveKit → Settings → API keys)
#   LIVEKIT_WORKER_TOKEN  (Pydent → Settings → LiveKit → "Generate worker token")
#   PYDENT_BASE           (your Pydent URL, e.g. https://pydentai.netlify.app)
# Environment-scoped secrets are NOT read unless the job targets that environment.
#
# Then: Actions → "Deploy LiveKit agent" → Run workflow. The first run
# registers the agent (create) automatically when no livekit.toml exists yet;
# later runs deploy code updates.
name: Deploy LiveKit agent

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "auto = create the first time, deploy afterwards"
        required: true
        default: auto
        type: choice
        options: [auto, create, deploy, status]

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  LIVEKIT_URL: ${{ secrets.LIVEKIT_URL || vars.LIVEKIT_URL }}
  LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY || vars.LIVEKIT_API_KEY }}
  LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET || vars.LIVEKIT_API_SECRET }}
  LIVEKIT_WORKER_TOKEN: ${{ secrets.LIVEKIT_WORKER_TOKEN || vars.LIVEKIT_WORKER_TOKEN }}
  PYDENT_BASE: ${{ secrets.PYDENT_BASE || vars.PYDENT_BASE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the 5 required values are present
        run: |
          missing=""
          for v in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET LIVEKIT_WORKER_TOKEN PYDENT_BASE; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing values:$missing"
            echo ""
            echo "Add them in GitHub → Settings → Secrets and variables → Actions → 'Secrets' tab → 'New repository secret'."
            echo "(Values placed under an Environment, or only under Variables of an Environment, are not visible to this workflow.)"
            exit 1
          fi
          echo "All 5 values present. LIVEKIT_URL host: $(echo "$LIVEKIT_URL" | sed -E 's#^[a-z]+://##')"

      - name: Decide create vs deploy
        id: op
        run: |
          op="${{ inputs.operation }}"
          if [ "$op" = "auto" ]; then
            if [ -f livekit-agent/livekit.toml ]; then op=deploy; else op=create; fi
          fi
          echo "operation=$op" >> "$GITHUB_OUTPUT"
          echo "Running: $op"

      - name: ${{ steps.op.outputs.operation }} agent on LiveKit Cloud
        uses: livekit/deploy-action@v2.12.2
        with:
          OPERATION: ${{ steps.op.outputs.operation }}
          WORKING_DIRECTORY: livekit-agent
        env:
          # The action reads SECRET_LIST from the environment (not as an input);
          # these become the worker container's secrets.
          SECRET_LIST: "PYDENT_BASE=${{ env.PYDENT_BASE }},LIVEKIT_WORKER_TOKEN=${{ env.LIVEKIT_WORKER_TOKEN }},AGENT_NAME=pydent-agent"

      - name: Commit livekit.toml after a first-time create
        if: steps.op.outputs.operation == 'create'
        run: |
          if [ -f livekit-agent/livekit.toml ] && ! git diff --quiet -- livekit-agent/livekit.toml 2>/dev/null || [ -n "$(git status --porcelain livekit-agent/livekit.toml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add livekit-agent/livekit.toml
            git commit -m "Add LiveKit agent config (livekit.toml) from first deploy" || true
            git push || true
          fi
